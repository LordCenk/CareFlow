server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: careflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:careflowdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

careflow:
  jwt:
    secret: ${JWT_SECRET:CareFlowSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHmacSha256Security2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  scheduling:
    reminder-hours-ahead: 24
    cancellation-deadline-hours: 2
    max-advance-booking-days: 60
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.careflow: DEBUG
    org.springframework.security: INFO
