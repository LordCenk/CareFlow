version: '3.8'

services:
  mysql:
    image: mysql:8.4.0
    container_name: careflow-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-careflow}
      MYSQL_USER: ${DB_USER:-careflow_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-careflow_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-careflow_root_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-careflow_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - careflow-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careflow-backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-careflow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-careflow_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-careflow_password}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      JWT_SECRET: ${JWT_SECRET:-CareFlowSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHmacSha256Security2026}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      PORT: 8080
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v3/api-docs || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - careflow-network

volumes:
  mysql_data:
    driver: local

networks:
  careflow-network:
    driver: bridge
